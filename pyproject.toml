[project]
name = "datamate"
version = "0.1.0"
description = "Agent hỏi đáp tiếng Việt trên dữ liệu bảng — Zalo AI Challenge 2026 (DataMate)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.8.3",
    "langgraph>=1.2.19",
    "openai>=3.45.0",
    "duckdb>=1.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# script chạy tay / báo cáo: cho phép dòng dài và tên ngắn
"scripts/*" = ["E501", "E741", "E731", "RUF100"]
"eval/breakdown.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src:."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
